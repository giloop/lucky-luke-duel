<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="shortcut icon" href="favicon.ico">
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Lucky Luke - Duel</title>
    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { width: 100%; height: 100%; overflow: hidden; }
      canvas { display: block; }

      #infos {
        position: fixed;
        bottom: 0;
        left: 0;
        max-width: 900px;
        background-color: rgba(0,0,0,0.5);
        color: white;
        padding: 10px;
      }
      #infos a { color: cyan; }
      #prod-label {
        font-size: 12px;
        cursor: pointer;
        user-select: none;
      }
      #prod-checkbox { margin-right: 4px; }

      #loading-overlay {
        position: fixed;
        inset: 0;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        background: #fff;
        z-index: 999;
        gap: 24px;
      }
      #loading-track {
        width: 40%;
        height: 6px;
        background: #ddd;
        border-radius: 3px;
        overflow: hidden;
      }
      #loading-fill {
        height: 100%;
        width: 0%;
        background: #1a1a1a;
        transition: width 0.25s ease;
      }
      #start-btn {
        display: none;
        width: 33vw;
        padding: 24px 0;
        font-size: 2rem;
        font-family: system-ui, sans-serif;
        font-weight: bold;
        background: #1a1a1a;
        color: #fff;
        border: none;
        border-radius: 10px;
        cursor: pointer;
        letter-spacing: 0.04em;
      }
    </style>
  </head>
  <body>
    <div id="infos">
    <input id="prod-checkbox" type="checkbox" />
    </div>
    <div id="loading-overlay">
      <div id="loading-track">
        <div id="loading-fill"></div>
      </div>
      <button id="start-btn">Start !</button>
    </div>
    <script type="module" src="/playground/main.ts"></script>
  </body>
</html>
