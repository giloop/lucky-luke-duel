<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="shortcut icon" href="favicon.ico">
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Lucky Luke - Duel</title>
    <style>
      @font-face {
        font-family: 'WesternFont';
        src: url('/assets/gomarice_nandaka_western.ttf');
      }

      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { width: 100%; height: 100%; overflow: hidden; }
      canvas { display: block; }

      #infos {
        position: fixed;
        bottom: 0;
        left: 0;
        max-width: 900px;
        background-color: #ffffff80;
        color: #8f4c00;
        padding: 10px;
        border-radius: 3px;
      }
      #infos a { color: cyan; }
      #prod-label {
        font-size: 12px;
        cursor: pointer;
        user-select: none;
      }
      #prod-checkbox { margin-right: 4px; }

      #loading-overlay {
        position: fixed;
        inset: 0;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        background: #fff;
        z-index: 999;
        gap: 24px;
      }
      #loading-track {
        width: 40%;
        height: 6px;
        background: #ddd;
        border-radius: 3px;
        overflow: hidden;
      }
      #loading-fill {
        height: 100%;
        width: 0%;
        background: #1a1a1a;
        transition: width 0.25s ease;
      }
      #start-btn {
        display: none;
        width: 33vw;
        padding: 24px 0;
        font-size: 2rem;
        font-family: system-ui, sans-serif;
        font-weight: bold;
        background: #1a1a1a;
        color: #fff;
        border: none;
        border-radius: 10px;
        cursor: pointer;
        letter-spacing: 0.04em;
      }

      #duel-countdown {
        display: none;
        position: fixed;
        inset: 0;
        align-items: center;
        justify-content: center;
        pointer-events: none;
        z-index: 100;
      }
      #duel-count {
        font-family: 'WesternFont', serif;
        font-size: 30vw;
        color: #ffffff;
        text-shadow: 6px 6px 0 #000;
        -webkit-text-stroke: 2px #000;
        align-self: flex-end;
      }
    </style>
  </head>
  <body>
    <div id="infos">
    <input id="prod-checkbox" type="checkbox" />
    </div>
    <div id="loading-overlay">
      <div id="loading-track">
        <div id="loading-fill"></div>
      </div>
      <button id="start-btn">Start !</button>
    </div>
    <div id="duel-countdown">5<span id="duel-count"></span></div>
    <script type="module" src="/playground/main.ts"></script>
  </body>
</html>
